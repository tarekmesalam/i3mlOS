name: ci

on:
  push:
  pull_request:

jobs:
  boot:
    name: framekernel check + QEMU boot test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU + OVMF
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf
      - name: Install Rust (rust-toolchain.toml pins nightly + UEFI target)
        run: rustup show
      - name: Framekernel rule — unsafe only in nawa/core
        run: cargo xtask check
      - name: Host tests (libraries are testable off the metal)
        run: cargo test -p i3ml-wasm -p i3ml-sha256 -p i3ml-journal
      - name: Boot the kernel in QEMU and assert the serial hello
        run: cargo xtask test
        # The model relay is started by the test itself and answers
        # deterministically unless a real endpoint is configured, so this
        # exercises the whole model path with no network and no secret.
      - name: Build the distributable image and boot it twice
        run: cargo xtask disk-test
      - uses: actions/upload-artifact@v4
        with:
          name: i3mlos-image
          path: target/i3mlos.img
          compression-level: 9
